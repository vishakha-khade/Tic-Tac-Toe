<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #d7e0f0;
        color: #222;
    }

    .main-content {
        width: 400px;
        max-width: 90%;
        text-align: center;
        padding: 30px 25px;
        background: rgb(91, 136, 181);
        border-radius: 18px;
        box-shadow: 0 0 40px rgb(38, 141, 196);
    }

    h1 {
        margin: 0 0 15px;
        font-size: 32px;
    }

    #current-player {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 20px;
    }

    .game {
        display: grid;
        grid-template-columns: repeat(3, 90px);
        gap: 8px;
        justify-content: center;
        margin: 0 auto;
    }

    .cell {
        width: 90px;
        height: 90px;
        border: none;
        border-radius: 10px;
        background: #081e51;
        font-size: 42px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
    }

    .cell:hover {
        background: #57bbe6;
        transform: scale(1.03);
    }

    .reset {
        margin-top: 25px;
        padding: 10px 25px;
        border: none;
        border-radius: 8px;
        background: #53cde6;
        color: black;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    .reset:hover {
        background: #444;
    }

    @media (max-width: 450px) {
        .main-content {
            padding: 25px 15px;
        }

        .game {
            grid-template-columns: repeat(3, 75px);
            gap: 7px;
        }

        .cell {
            width: 75px;
            height: 75px;
            font-size: 35px;
        }

        h1 {
            font-size: 28px;
        }
    }
</style>
</head>

<body>
    <div class="main-content">
        <h1>Tic Tac Toe</h1>

        <p id="current-player">Current Player: O</p>
        <div class="game">
            <div class="cell" onclick="move(0)"></div>
            <div class="cell" onclick="move(1)"></div>
            <div class="cell" onclick="move(2)"></div>
            <div class="cell" onclick="move(3)"></div>
            <div class="cell" onclick="move(4)"></div>
            <div class="cell" onclick="move(5)"></div>
            <div class="cell" onclick="move(6)"></div>
            <div class="cell" onclick="move(7)"></div>
            <div class="cell" onclick="move(8)"></div>
        </div>
        <button type="button" class="reset" onclick="reset()">Reset</button>
    </div>
    <script>

        const cellbox = [-1, -1, -1, -1, -1, -1, -1, -1, -1];

        let currentPlayer = "O";
        let gameover = false;

        const renderBox = () =>{

            const boxes = document.querySelectorAll(".cell"); 
            console.log(boxes);
               
            boxes.forEach((box, index) => {
                if(cellbox[index] === "O") {
                    box.innerText = "O";
                    box.style.color = "#ff6b6b";
                }
                else if (cellbox[index] === "X") {
                    box.innerText = "X";
                    box.style.color = "#6c5ce7";
                }
                else {
                    box.innerText = "";
                }
            })
        };

        const move = (index) =>{
            if (gameover) {
                alert("Game is over. Please reset the game.")
                return;
            }

            if (cellbox[index] !== -1){
                alert("Invalid Move");
                return
            }
            
            cellbox[index] = currentPlayer;
            renderBox()

            const winner = checkwin();

            if(winner) {
                alert(`${winner} wins!`)
                gameover = true;
                return;
            }

            if(!cellbox.includes(-1)){
                alert("Game Tie, restart game")
                gameover = true;
                return;
            }

            if(currentPlayer === "O") {
                currentPlayer = "X"
            }
            else{
                currentPlayer = "O"
            }
            
            document.getElementById("current-player").innerText = `Current Player: ${currentPlayer}`;
        }

        function playerPresent(places, player){
            const [a, b, c] = places;

            return(
                cellbox[a] === player && 
                cellbox[b] === player &&
                cellbox[c] === player
            )
        }

        function checkwin() {
            const winner = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6],
            ];

            for (let combination of winner) {
                if (playerPresent(combination, "O")) {
                    return "O"
                }

                if  (playerPresent(combination, "X")) {
                    return "X"
                }
            }
            
            return null;
        }

        function reset() {

            cellbox.fill(-1);
            currentPlayer = "O";
            gameover = false;

            document.getElementById("current-player").innerText = `Current Player: O`;       
            
            renderBox();
        }
    </script>
</body>
</html>
